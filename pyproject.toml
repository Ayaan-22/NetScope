[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netscope-scanner"
version = "2.1.0"
description = "Async network vulnerability scanner with local CVE matching and multi-format reporting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayaan" }]
keywords = ["security", "scanner", "network", "ports", "cve"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking",
]
dependencies = [
  "python-nmap>=0.7.1",
  "PyYAML>=6.0.1",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
]

[project.scripts]
netscope = "main:main"
netscope-dashboard = "src.dashboard.app:main"

[tool.setuptools]
packages = ["src", "src.scanner", "src.reporting", "src.utils", "src.dashboard"]
py-modules = ["main"]

[tool.setuptools.package-data]
"src.dashboard" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.data-files]
"config" = ["config/cve_db.csv", "config/settings.yaml.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests", "report_analysis"]

[tool.ruff.lint]
select = ["E", "F", "B", "S"]
ignore = ["E501", "S101", "S603", "S607"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
